[project]
name = "finance-server"
version = "0.1.0"
description = "Personal finance command center - API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "uvicorn>=0.32",
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by Alembic.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends()/Query() in argument defaults is the framework's idiom.
ignore = ["B008"]
